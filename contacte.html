    <link rel="preconnect" href="https://fonts.googleapis.com">

<header>

        <img src="imatges/tmdblogo.png" alt="Logotip TMDB" width="100px" height="90px">
    </a>
    <nav>
        <ul>
            <li><a href="index.html#buscador">Buscador</a></li>
            <li><a href="contacte.html">Contacte</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="contacte">
        <h1>Contacta amb nosaltres</h1>
        <p>Tens algun dubte o suggeriment? Escriu-nos.</p>

        <form class="form-contacte" action="#" method="post">
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" placeholder="El teu nom">

            <label for="email">Correu electrònic</label>
            <input type="email" id="email" name="email" placeholder="nom@exemple.com">

            <label for="missatge">Missatge</label>
            <textarea id="missatge" name="missatge" rows="6" placeholder="Escriu el teu missatge..."></textarea>

            <button type="submit">Enviar</button>
        </form>
    </section>
</main>

<footer class="footer">
    <p>© 2026 The Movie Database — Maqueta de disseny</p>
</footer>
</body>
</html>
